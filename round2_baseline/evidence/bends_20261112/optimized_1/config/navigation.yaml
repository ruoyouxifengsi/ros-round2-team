TebLocalPlannerROS:
  allow_init_with_backwards_motion: true
  acc_lim_theta: 1.0
  acc_lim_x: 0.5
  acc_lim_y: 0.5
  costmap_obstacles_behind_robot_dist: 1.5
  dt_hysteresis: 0.05
  dt_ref: 0.25
  enable_homotopy_class_planning: false
  feasibility_check_no_poses: 5
  footprint_model:
    type: polygon
    vertices: &id001
    - - 0.194220130443573
      - 0.08160269758982476
    - - 0.14013179866755857
      - 0.1356910293658392
    - - -0.14122293480219403
      - 0.13569102936583924
    - - -0.16874850273132325
      - 0.10816546143671002
    - - -0.16874850273132325
      - -0.1081139524451482
    - - -0.1411714212889395
      - -0.13569103388753195
    - - 0.14072503857793206
      - -0.135691033887532
    - - 0.194220130443573
      - -0.0821959420218911
  free_goal_vel: false
  force_reinit_new_goal_dist: 0.1
  global_plan_overwrite_orientation: true
  include_costmap_obstacles: true
  inflation_dist: 0.12
  map_frame: odom
  max_global_plan_lookahead_dist: 1.5
  max_samples: 80
  max_vel_theta: 0.5
  max_vel_x: 0.25
  max_vel_x_backwards: 0.12
  max_vel_y: 0.15
  min_obstacle_dist: 0.02
  min_samples: 5
  odom_topic: /odom
  penalty_epsilon: 0.005
  publish_feedback: true
  weight_inflation: 0.1
  weight_kinematics_forward_drive: 1.0
  weight_kinematics_nh: 1.0
  weight_obstacle: 500.0
  weight_optimaltime: 10.0
  xy_goal_tolerance: 0.03
  yaw_goal_tolerance: 0.25
base_local_planner: teb_local_planner/TebLocalPlannerROS
conservative_reset_dist: 3.0
controller_frequency: 10.0
controller_patience: 15.0
global_costmap:
  footprint: *id001
  footprint_padding: 0.005
  global_frame: odom
  height: 10
  map_type: costmap
  publish_frequency: 10.0
  resolution: 0.025
  robot_base_frame: base_footprint
  rolling_window: true
  static_map: false
  transform_tolerance: 0.5
  update_frequency: 10.0
  width: 10
  plugins:
  - name: obstacle_layer
    type: costmap_2d::ObstacleLayer
  - name: cone_layer
    type: costmap_2d::ObstacleLayer
  - name: inflation_layer
    type: costmap_2d::InflationLayer
  obstacle_layer:
    observation_sources: scan
    scan:
      clearing: true
      data_type: LaserScan
      marking: true
      sensor_frame: laser_link
      topic: /nav_scan
    obstacle_range: 2.5
    raytrace_range: 3.0
  cone_layer:
    observation_sources: cones
    cones:
      topic: /cone_footprints
      data_type: PointCloud2
      marking: true
      clearing: false
      obstacle_range: 10.0
      min_obstacle_height: 0.0
      max_obstacle_height: 1.0
  inflation_layer:
    inflation_radius: 1.0
    cost_scaling_factor: 3.0
local_costmap:
  always_send_full_costmap: true
  footprint: *id001
  footprint_padding: 0.005
  global_frame: odom
  height: 3
  map_type: costmap
  publish_frequency: 10.0
  resolution: 0.025
  robot_base_frame: base_footprint
  rolling_window: true
  static_map: false
  transform_tolerance: 0.5
  update_frequency: 10.0
  width: 3
  plugins:
  - name: obstacle_layer
    type: costmap_2d::ObstacleLayer
  - name: cone_layer
    type: costmap_2d::ObstacleLayer
  - name: inflation_layer
    type: costmap_2d::InflationLayer
  obstacle_layer:
    observation_sources: scan
    scan:
      clearing: true
      data_type: LaserScan
      marking: true
      sensor_frame: laser_link
      topic: /nav_scan
    obstacle_range: 2.5
    raytrace_range: 3.0
  cone_layer:
    observation_sources: cones
    cones:
      topic: /cone_footprints
      data_type: PointCloud2
      marking: true
      clearing: false
      obstacle_range: 10.0
      min_obstacle_height: 0.0
      max_obstacle_height: 1.0
  inflation_layer:
    inflation_radius: 1.0
    cost_scaling_factor: 3.0
oscillation_distance: 0.2
oscillation_timeout: 30.0
planner_frequency: 5.0
planner_patience: 5.0
shutdown_costmaps: false
